syntax = "proto3";

package health.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/dsx-ai-factory/health-validation/collect/proto/go/health/v1;healthv1";

// ObservationBatch is the shared payload of one collection cycle.
// Additive-only within a major version: new signals get added, old ones
// are never repurposed.
message ObservationBatch {
  string collection_id = 1;
  repeated Observation observations = 2;
  HardwareInventory inventory = 3;
}

// HardwareInventory carries structured entity information separately from
// metric and event observations. Additional inventory domains can be added
// without representing their records as scalar signals.
message HardwareInventory {
  // One snapshot per source that collected GPU inventory. An absent snapshot
  // means GPU inventory was not collected from that source.
  repeated GpuInventorySnapshot gpu_snapshots = 1;
}

// GpuInventorySnapshot is one source's GPU inventory contribution for this
// collection cycle. Exactly one outcome must be selected. A successful
// inventory with no entries means the source found no GPUs.
message GpuInventorySnapshot {
  string source = 1;
  google.protobuf.Timestamp collected_at = 2;

  oneof outcome {
    GpuInventory inventory = 3;
    CollectionError collection_error = 4;
  }
}

message GpuInventory {
  repeated GpuInventoryEntry entries = 1;
}

// GpuInventoryEntry preserves every enumerated source-local GPU. A failed
// device-information lookup affects only that entry; healthy GPUs remain in
// the same inventory snapshot.
message GpuInventoryEntry {
  // The source's enumeration index (the DCGM device ID for a DCGM snapshot).
  uint32 source_index = 1;

  oneof outcome {
    GpuDevice device = 2;
    CollectionError collection_error = 3;
  }
}

// GpuDevice is one successfully collected structured GPU inventory record.
// Optional fields may be absent when the source legitimately has no value.
message GpuDevice {
  optional string uuid = 1;
  optional string model = 2;
  optional string serial = 3;
  optional string bus_id = 4;
  optional string brand = 5;
  optional string vbios_version = 6;
  optional string chassis_serial = 7;
  optional int64 minor_number = 8;
  optional string fabric_cluster_uuid = 9;
  optional uint32 fabric_clique_id = 10;
  optional uint32 compute_capability_major = 11;
  optional uint32 compute_capability_minor = 12;
  optional uint64 framebuffer_total_bytes = 13;
  optional string driver_version = 14;
  optional string cuda_driver_version = 15;
}

message Observation {
  string signal_id = 1;
  string source = 2;
  ObservationTarget target = 3;
  google.protobuf.Timestamp observed_at = 4;

  // Optional because inventory and event signals may not have a unit.
  optional string unit = 5;

  // Exactly one outcome: a value, the reason collection failed, or a
  // successful collection that produced no value. Collection status never
  // lives in the value -- no sentinel values.
  oneof outcome {
    Value value = 6;
    CollectionError collection_error = 7;
    NoValue no_value = 8;
  }
}

// ObservationTarget identifies exactly what an observation describes.
// New canonical target kinds can be added without relying on string keys.
message ObservationTarget {
  oneof kind {
    NodeRef node = 1;
    GpuRef gpu = 2;
    NvLinkEndpointRef nv_link_endpoint = 3;
    GpuPairRef gpu_pair = 4;
  }
}

message NodeRef {
  string id = 1;
}

// GpuRef identifies a GPU by UUID when available. A source-local ID keeps a
// failed UUID lookup attributable to one GPU without presenting it as a UUID.
message GpuRef {
  string uuid = 1;
  string source_local_id = 2;
}

// NvLinkEndpointRef identifies one local NVLink endpoint on a physical GPU.
// It does not claim which remote entity is connected to that endpoint.
message NvLinkEndpointRef {
  GpuRef gpu = 1;
  uint32 link_index = 2;
}

// GpuPairRef identifies an ordered source/peer GPU pair. It describes P2P
// capability and does not imply a direct physical NVLink.
message GpuPairRef {
  GpuRef source_gpu = 1;
  GpuRef peer_gpu = 2;
}

// Value is a typed observed value.
message Value {
  oneof kind {
    int64 int_value = 1;
    double double_value = 2;
    string string_value = 3;
    bool bool_value = 4;
  }
}

// CollectionError records why a signal could not be collected. It keeps the
// source's symbolic error next to the normalized category, because collapsing
// them loses information the catalog needs.
// It carries no health severity; each consumer decides what a failed
// observation means for its own result.
message CollectionError {
  string source = 1;
  string operation = 2;
  string source_error = 4;
  string detail = 5;
  CollectionErrorCategory category = 3;
}

// NoValue records a successful collection that has no value for the requested
// signal or target. This is distinct from a collection failure and from a
// source status that is itself the observed value.
message NoValue {
  NoValueReason reason = 1;
  string detail = 2;
  string source_status = 3;
}

enum CollectionErrorCategory {
  COLLECTION_ERROR_CATEGORY_UNSPECIFIED = 0;
  COLLECTION_ERROR_CATEGORY_TIMEOUT = 1;
  COLLECTION_ERROR_CATEGORY_UNSUPPORTED = 2;
  COLLECTION_ERROR_CATEGORY_UNAVAILABLE = 3;
  COLLECTION_ERROR_CATEGORY_NOT_CONFIGURED = 4;
  COLLECTION_ERROR_CATEGORY_PERMISSION_DENIED = 5;
  COLLECTION_ERROR_CATEGORY_PARSE_ERROR = 6;
  COLLECTION_ERROR_CATEGORY_SOURCE_ERROR = 7;
}

enum NoValueReason {
  NO_VALUE_REASON_UNSPECIFIED = 0;
  // The target reported that this value is not supported.
  NO_VALUE_REASON_NOT_SUPPORTED = 1;
  // Collection succeeded, but there were no targets for this signal.
  NO_VALUE_REASON_NO_TARGETS = 2;
}
