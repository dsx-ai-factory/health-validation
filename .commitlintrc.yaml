# Conventional Commits rules, checked on pull requests by
# .github/workflows/commit-lint.yml.
extends:
  - "@commitlint/config-conventional"

# commitlint's CLI ignores ten message shapes by default (Revert "...",
# Merge branch ..., fixup!, bare semver), exiting 0 with no rule evaluated and
# no visible difference in the log. This gate lints single-line titles, never a
# commit range, so nothing here needs ignoring.
defaultIgnores: false

helpUrl: https://github.com/dsx-ai-factory/health-validation/blob/main/CONTRIBUTING.md#commit-and-pr-titles

rules:
  # config-conventional also bans sentence-case, which rejects any subject
  # starting with a capital. This repo's vocabulary is acronyms (RDMA, XID,
  # NVML, GB300), so a leading capital is normal here. Title-case and all-caps
  # subjects stay banned.
  subject-case: [2, never, [start-case, pascal-case, upper-case]]
