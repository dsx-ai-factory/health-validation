packages:
  - docs

onlyBuiltDependencies:
  - esbuild

overrides:
  webpack: 5.104.1
  # serialize-javascript 6.x is flagged with no patch past 6.0.2; force the
  # patched 7.x line. It is a build-time-only transitive dep (copy-webpack-plugin,
  # css-minimizer-webpack-plugin) and requires Node >=20 (see docs/package.json).
  serialize-javascript: 7.0.7
  # CVE-2026-84370 (high) and CVE-2026-84369 (medium): svgo's opt-in
  # removeScriptElement plugin leaks executable links and foreignObject HTML past
  # sanitization. Build-time only, reaching us through @svgr/plugin-svgo and
  # postcss-svgo under @docusaurus/preset-classic. An override is needed because
  # the patched 4.x line is unreachable here: cssnano-preset-default 6.1.2 caps
  # postcss-svgo at ^6.0.3, 6.0.3 is the last of that line, and postcss-svgo only
  # moved to svgo 4 in 7.1.0. Drop this once Docusaurus resolves postcss-svgo
  # >= 7.1.0.
  svgo: 3.3.5
  # CVE-2026-69152 (high) and four related brace-expansion DoS advisories, all
  # fixed in 1.1.21. Build-time only, reaching us through serve-handler under
  # @docusaurus/core, and serve-handler pins minimatch 3.1.5. Drop this once
  # serve-handler moves off minimatch 3.
  'minimatch@3>brace-expansion': 1.1.21
  # CVE-2026-76844 (high): webpack-dev-middleware's getFilenameFromUrl lets a
  # request escape the output directory when publicPath lacks a trailing slash.
  # Used only by the docs dev server (bazel run //docs:serve), reaching us
  # through webpack-dev-server 5.2.6 under @docusaurus/core. 8.3.0 is outside
  # webpack-dev-server 5's declared ^7.4.2, but webpack-dev-server 5 uses only
  # middleware APIs that 8.x still exports. Drop this once Docusaurus moves to
  # webpack-dev-server 6, which requires 8.x itself.
  'webpack-dev-server@5>webpack-dev-middleware': 8.3.0
  # CVE-2026-41907 (moderate): uuid's v3, v5 and v6 skip bounds checks on a
  # caller-supplied buffer. Not reached here: sockjs only calls v4, and
  # webpack-dev-server loads sockjs only when webSocketServer is "sockjs",
  # which Docusaurus does not set. sockjs 0.3.24, its last release, pins
  # ^8.3.2. 11.1.1 is the newest uuid that still ships CommonJS, which sockjs
  # requires. Drop this once Docusaurus moves to webpack-dev-server 6, which
  # no longer depends on sockjs.
  'sockjs>uuid': 11.1.1
  # CVE-2026-104848 and CVE-2026-104849 (critical): prototype-pollution gadgets
  # in tinypool's worker and run() options lead to code execution. Build-time
  # only, used by @docusaurus/core for the SSG thread pool. 3.10.2 declares
  # ^1.0.2 and no 1.x patch exists; 2.x drops Node 18 (docs already require
  # >=20) but keeps every option and export Docusaurus uses. Drop this once
  # Docusaurus depends on tinypool >= 2.1.2.
  '@docusaurus/core>tinypool': 2.1.2
