version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directory: /catalog
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directory: /toolkit
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directory: /collect
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directory: /agentkit
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
    open-pull-requests-limit: 5
