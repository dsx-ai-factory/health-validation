name: CI

# Triggered on pushes to main, module release tags, and pull-request/* branches.
#
# pull-request/<number> branches are created by copy-pr-bot when a pull request
# is opened against this repository, so self-hosted runners are not triggered
# directly by pull_request events, which can originate from untrusted forks.
on:
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
    tags:
      - "toolkit/v*"
      - "catalog/v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded pull-request runs, but let main and releases finish.
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/pull-request/') }}

jobs:

  # Resolve the versions once for the workflow. This also rejects malformed
  # module tags before any release artifact can be published.
  release-metadata:
    if: github.repository == 'dsx-ai-factory/health-validation'
    runs-on: linux-amd64-cpu4
    timeout-minutes: 5
    outputs:
      toolkit_version: ${{ steps.status.outputs.toolkit_version }}
      catalog_version: ${{ steps.status.outputs.catalog_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate release metadata
        id: status
        run: |
          status="$(./tools/workspace_status_release.sh)"
          printf '%s\n' "$status"

          toolkit_version="$(
            printf '%s\n' "$status" |
              awk '$1 == "STABLE_HEALTH_VALIDATION_VERSION" { print $2; exit }'
          )"
          catalog_version="$(
            printf '%s\n' "$status" |
              awk '$1 == "STABLE_HEALTH_VALIDATION_CATALOG_VERSION" { print $2; exit }'
          )"
          if [[ -z "$toolkit_version" || -z "$catalog_version" ]]; then
            echo "could not determine toolkit and catalog versions" >&2
            exit 1
          fi

          {
            echo "toolkit_version=$toolkit_version"
            echo "catalog_version=$catalog_version"
          } >> "$GITHUB_OUTPUT"

  lint:
    # Guard: only run on the canonical repository, not forks.
    if: github.repository == 'dsx-ai-factory/health-validation'
    runs-on: linux-amd64-cpu4
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel

      - name: Format check
        run: bazel test //tools/format:test

      - name: Gazelle check
        run: bazel run //tools/gazelle:ci

      - name: Go mod tidy check (agentkit)
        run: cd agentkit && bazel run //tools/go -- mod tidy -diff

      - name: Go mod tidy check (catalog)
        run: cd catalog && bazel run //tools/go -- mod tidy -diff

      - name: Go mod tidy check (collect)
        run: cd collect && bazel run //tools/go -- mod tidy -diff

      - name: Go mod tidy check (toolkit)
        run: cd toolkit && bazel run //tools/go -- mod tidy -diff

      - name: NOTICE up to date check
        run: bazel run //tools:check_notice

  test:
    if: github.repository == 'dsx-ai-factory/health-validation'
    runs-on: linux-amd64-cpu4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel

      - name: Test
        run: bazel test --config=ci //...

  build-amd64:
    if: github.repository == 'dsx-ai-factory/health-validation'
    needs: release-metadata
    runs-on: linux-amd64-cpu4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel

      - name: Build and smoke-test image (linux/amd64)
        env:
          EXPECTED_TOOLKIT_VERSION: ${{ needs.release-metadata.outputs.toolkit_version }}
          EXPECTED_CATALOG_VERSION: ${{ needs.release-metadata.outputs.catalog_version }}
        run: |
          set -euo pipefail
          bazel build --config=release-ci --platforms=//build/platforms:linux_amd64 \
            --remote_download_outputs=toplevel \
            //toolkit/cmd/health-validation:health-validation.image.tar
          docker load -i \
            bazel-bin/toolkit/cmd/health-validation/health-validation.image.local_load/tarball.tar

          metadata="$(docker run --rm health-validation:latest version --output json)"
          embedded_toolkit="$(printf '%s\n' "$metadata" | jq -er '.version')"
          embedded_catalog="$(printf '%s\n' "$metadata" | jq -er '.catalogVersion')"
          if [[ "$embedded_toolkit" != "$EXPECTED_TOOLKIT_VERSION" ||
                "$embedded_catalog" != "$EXPECTED_CATALOG_VERSION" ]]; then
            echo "version stamp mismatch: toolkit='$embedded_toolkit' catalog='$embedded_catalog'; expected toolkit='$EXPECTED_TOOLKIT_VERSION' catalog='$EXPECTED_CATALOG_VERSION'" >&2
            exit 1
          fi

  build-arm64:
    if: github.repository == 'dsx-ai-factory/health-validation'
    needs: release-metadata
    # Run natively on an arm64 runner — no cross-compilation needed.
    runs-on: linux-arm64-cpu4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel

      - name: Build and smoke-test image (linux/arm64)
        env:
          EXPECTED_TOOLKIT_VERSION: ${{ needs.release-metadata.outputs.toolkit_version }}
          EXPECTED_CATALOG_VERSION: ${{ needs.release-metadata.outputs.catalog_version }}
        run: |
          set -euo pipefail
          bazel build --config=release-ci --platforms=//build/platforms:linux_arm64 \
            --remote_download_outputs=toplevel \
            //toolkit/cmd/health-validation:health-validation.image.tar
          docker load -i \
            bazel-bin/toolkit/cmd/health-validation/health-validation.image.local_load/tarball.tar

          metadata="$(docker run --rm health-validation:latest version --output json)"
          embedded_toolkit="$(printf '%s\n' "$metadata" | jq -er '.version')"
          embedded_catalog="$(printf '%s\n' "$metadata" | jq -er '.catalogVersion')"
          if [[ "$embedded_toolkit" != "$EXPECTED_TOOLKIT_VERSION" ||
                "$embedded_catalog" != "$EXPECTED_CATALOG_VERSION" ]]; then
            echo "version stamp mismatch: toolkit='$embedded_toolkit' catalog='$embedded_catalog'; expected toolkit='$EXPECTED_TOOLKIT_VERSION' catalog='$EXPECTED_CATALOG_VERSION'" >&2
            exit 1
          fi

  # Scan the packaged image for known CVEs and generate its SBOM (shared
  # scan-image action). amd64 only: both images share the same Ubuntu base,
  # so arm64 reports the same base-image CVEs.
  #
  # Split into scan/scan-release because scan-image's SBOM step attaches to
  # the tag's GitHub Release when one exists, which needs contents: write.
  # scan builds and tests whatever the triggering branch contains, including
  # pull-request/* branches mirroring untrusted fork PRs (see the `on.push`
  # comment above), so it keeps a read-only token and never attempts the
  # attach (no release exists for a PR or main commit). Toolkit release tags
  # — which only a maintainer can push, and which never run PR-controlled
  # code — get the write-capable scan-release job instead.
  scan:
    if: >-
      github.repository == 'dsx-ai-factory/health-validation' &&
      !startsWith(github.ref, 'refs/tags/toolkit/v')
    runs-on: linux-amd64-cpu4
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel

      - uses: ./.github/actions/scan-image

  scan-release:
    if: >-
      github.repository == 'dsx-ai-factory/health-validation' &&
      startsWith(github.ref, 'refs/tags/toolkit/v')
    runs-on: linux-amd64-cpu4
    timeout-minutes: 30
    permissions:
      contents: write
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel

      - uses: ./.github/actions/scan-image

  # scan and scan-release are mutually exclusive, so exactly one is always
  # 'skipped'. Folding that into a single pass/fail job here lets
  # publish-image depend on a plain `needs: [..., scan-status]` instead of
  # spelling out per-job result checks in its own `if`.
  scan-status:
    if: always() && github.repository == 'dsx-ai-factory/health-validation'
    needs:
      - scan
      - scan-release
    runs-on: linux-amd64-cpu4
    timeout-minutes: 1
    steps:
      - name: Check scan/scan-release results
        shell: bash
        env:
          SCAN_RESULT: ${{ needs.scan.result }}
          SCAN_RELEASE_RESULT: ${{ needs.scan-release.result }}
        run: |
          for result in "$SCAN_RESULT" "$SCAN_RELEASE_RESULT"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::scan/scan-release did not succeed: scan=$SCAN_RESULT scan-release=$SCAN_RELEASE_RESULT" >&2
              exit 1
            fi
          done

  # Publish one OCI index containing linux/amd64 and linux/arm64. Main advances
  # both its immutable pseudo-version and latest; toolkit release tags publish
  # only the immutable semantic version. The architecture build jobs execute
  # each stamped image and verify its toolkit and catalog versions first. The
  # GITHUB_TOKEN is scoped to this job, and rules_oci reads the credentials
  # written by docker login.
  publish-image:
    if: >-
      github.repository == 'dsx-ai-factory/health-validation' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/toolkit/v'))
    needs:
      - release-metadata
      - lint
      - test
      - build-amd64
      - build-arm64
      - scan-status
    runs-on: linux-amd64-cpu4
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      # Version generation needs the module's complete tag history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin

      - name: Publish multi-architecture image
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          EXPECTED_TOOLKIT_VERSION: ${{ needs.release-metadata.outputs.toolkit_version }}
        run: |
          version="$EXPECTED_TOOLKIT_VERSION"
          if [[ -z "$version" ]]; then
            echo "could not determine the image version" >&2
            exit 1
          fi

          tags=(--tag "${version#v}")
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            tags+=(--tag latest)
          fi

          bazel run --config=release-ci --remote_download_outputs=toplevel \
            //toolkit/cmd/health-validation:health-validation.image.push -- \
            --repository "$IMAGE_REPOSITORY" "${tags[@]}"
