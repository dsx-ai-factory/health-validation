name: Commit Lint

# pull_request_target, not pull_request: GitHub loads a pull_request_target
# workflow from the default branch, so a pull request cannot edit the gate that
# judges it. Under pull_request it could add `if: false` to this job, and a
# skipped job reports Success and satisfies a required status check.
#
# That trigger is only safe because this job never checks out or executes pull
# request content. It reads the base commit and the title from the event
# payload. Do not add a head-ref or merge-ref checkout here, and do not widen
# `permissions`.
#
# The title exists only in this event's payload, which is why this does not
# ride on the pull-request/<number> push that drives ci.yml.
#
# Linting only the title is sound because the repository is squash-only with
# squash_merge_commit_title=PR_TITLE. If either setting changes, commit subjects
# reach `main` again and this job stops covering them.
#
# `edited` is not optional. Without it, correcting a rejected title never
# re-runs the check and it stays red.
on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:

  # Shaped to mirror the commitlint action in dsx-ai-factory/dsx-github-actions:
  # same step names, same install flags, same default config discovery. It
  # deviates where it must: the title arrives on stdin rather than as a
  # --from/--to range, versions are pinned, Node is 22 rather than the action's
  # 20. That action lints commit ranges
  # and has no input for a title, so this job stands in until a title mode lands
  # upstream, then it should become a `uses:` of it.
  commit-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No `ref:` on purpose. Under pull_request_target the default checkout is
      # the base repository's default branch, which is both trusted and certain
      # to carry the rules. Pinning to the PR's base commit instead checks out a
      # tree that predates them on every already-open PR, and on any PR stacked
      # on a feature branch, so commitlint exits 9 on a title it never read.
      #
      # commitlint discovers its config from the working tree and `extends`
      # loads code from it, so this must never point at PR-controlled content.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # commitlint 21 declares engines.node >= 22.12.0.
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      # Exact pins, not a range: a new 21.x patch is a new artifact executing
      # on the runner, and there is no Dependabot here to vet one. Bump both
      # together and deliberately. Transitive deps still float; a lockfile
      # would close that, at the cost of a lockfile for a one-step install.
      - name: Install commitlint
        run: npm install --no-package-lock --no-save --ignore-scripts @commitlint/cli@21.2.2 @commitlint/config-conventional@21.2.2

      # Rules come from commitlint.config.js via commitlint's default discovery.
      # The action calls `npx commitlint`; this calls the local binary so a
      # resolution miss fails here instead of triggering a network install.
      # Worth raising upstream.
      #
      # The title is untrusted input: pass it through the environment, never
      # interpolate it into the run command.
      - name: Run commitlint
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | ./node_modules/.bin/commitlint --verbose
