# Workflow 1 of 2 for Fern doc previews.
#
# Collects the docs/ sources, frozen version content and PR metadata from the PR
# branch and uploads them as an artifact. No secrets are used here, so this is
# runs from copy-pr-bot's pull-request/<number> branches, like ci.yml.
#
# The companion workflow (fern-docs-preview-comment.yml) treats the artifact as
# untrusted: it builds the preview with FERN_TOKEN against fern/ from the default
# branch and copies in only this artifact's docs/ and fern/versions/*-content.
# The rest of the uploaded fern/ is ignored there.

name: "Preview Fern Docs: Build"

on:
  push:
    branches:
      - "pull-request/[0-9]+"
    paths:
      - 'docs/**'
      - 'fern/**'
      - '.github/workflows/fern-docs-preview-build.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    if: github.repository == 'dsx-ai-factory/health-validation'
    runs-on: linux-amd64-cpu4
    timeout-minutes: 10
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Save PR metadata
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p preview-metadata
          echo "${BRANCH_NAME#pull-request/}" > preview-metadata/pr_number
          git diff --name-only "origin/main...HEAD" -- '*.md' > preview-metadata/changed_md_files 2>/dev/null || true

      - name: Checkout frozen version content
        run: |
          set -eo pipefail
          for version_file in fern/versions/v*.yml; do
            [ -f "$version_file" ] || continue
            version=$(basename "$version_file" .yml)
            if git show-ref --verify --quiet "refs/tags/${version}"; then
              mkdir -p "fern/versions/${version}-content"
              git archive "refs/tags/${version}" -- docs/ | tar -x --strip-components=1 -C "fern/versions/${version}-content"
              # Escape {, }, < for MDX — but only outside fenced code blocks and inline code spans
              find "fern/versions/${version}-content" -name '*.md' -print0 | while IFS= read -r -d '' f; do
                awk '
                  /^[ \t]*(```|~~~)/ { fence = !fence; print; next }
                  fence { print; next }
                  {
                    n = split($0, p, "`")
                    out = ""
                    for (i = 1; i <= n; i++) {
                      if (i % 2 == 1) {
                        # Keep braces the author already escaped (\{ must not become \\{).
                        gsub(/\\\{/, "\001", p[i])
                        gsub(/\\\}/, "\002", p[i])
                        gsub(/{/, "\\{", p[i])
                        gsub(/}/, "\\}", p[i])
                        gsub(/</, "\\&lt;", p[i])
                        gsub(/\001/, "\\{", p[i])
                        gsub(/\002/, "\\}", p[i])
                      }
                      out = out p[i]
                      if (i < n) out = out "`"
                    }
                    print out
                  }
                ' "$f" > "${f}.tmp" && mv "${f}.tmp" "$f"
              done
              echo "Extracted docs from $version"
            else
              echo "::error::Tag $version not found — cannot load frozen docs content"
              exit 1
            fi
          done

      - name: Upload fern sources and metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fern-preview
          path: |
            fern/
            docs/
            preview-metadata/
          retention-days: 1
