# Docs pre-flight check — runs on a schedule and before releases.
#
# Complements the PR-time fern-docs-ci.yml with checks that are too slow or
# network-dependent to run on every pull request:
#
#   1. External link check — lychee without --offline; catches link rot in
#      external URLs that fern docs broken-links does not follow.
#
# Trigger manually before cutting a release to confirm the docs are clean.
#
# No secrets required.

name: Fern Docs Preflight

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly, Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  external-links:
    name: External Link Check
    if: github.repository == 'dsx-ai-factory/health-validation'
    runs-on: linux-amd64-cpu4
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check external links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Pages link to each other by Fern path (/health-validation/...), which
          # is not a file under docs/. --root-dir lets lychee resolve those
          # links and --exclude skips them; `fern docs broken-links` checks them.
          # Add --exclude-path 'docs/<dir>' to args for each docs/ subdirectory
          # kept out of the published site.
          args: >-
            --no-progress
            --root-dir docs
            --exclude '/docs/health-validation/'
            --exclude-loopback
            --exclude 'localhost'
            --exclude 'docs\.nvidia\.com'
            --exclude-path 'docs/validation'
            --retry-wait-time 5
            'docs/**/*.md'
          fail: true
