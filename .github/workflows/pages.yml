name: Pages

# Kept separate from ci.yml on purpose. ci.yml also runs on pull-request/*
# branches, which must never deploy; GitHub permits one in-flight Pages
# deployment, which needs a concurrency group that would fight ci.yml's
# per-ref group; and `pages: write` / `id-token: write` stay scoped to the one
# job that needs them instead of being granted to all of CI.
#
# workflow_dispatch republishes without a push, which is needed after a change
# that affects the site but does not touch the repository, such as making it
# public.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:

  build:
    if: github.repository == 'dsx-ai-factory/health-validation'
    runs-on: linux-amd64-cpu4
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Placed before the build so a repository without Pages enabled fails in
      # seconds rather than after a full Docusaurus build.
      - uses: actions/configure-pages@v6
        id: pages

      # Pinned to CI so this shares the disk cache that workflow already warms
      # for the same targets. Its own key would start cold, and only the disk
      # cache is workflow-scoped: the repository and bazelisk caches are shared
      # either way.
      - name: Set up Bazel
        uses: ./.github/actions/setup-bazel
        with:
          disk-cache: CI

      # Deliberately no `paths:` filter on the trigger. The check reference
      # pages are generated from catalog/**/*.go by //catalog/cmd/gencheckpages,
      # so filtering on docs/** would silently keep serving a stale catalog
      # after a check changes.
      #
      # Pages serves an access-controlled site from the root of a generated
      # subdomain rather than under dsx-ai-factory.github.io/<repo>/, so a
      # url/baseUrl baked in for the public site would 404 every asset and
      # mislabel every canonical link. configure-pages reports which of the
      # two this repository currently is, so the build gets it right rather
      # than a later step catching the mismatch.
      - name: Build the docs site
        run: |
          bazel build --config=ci \
            --define=DOCS_URL="${{ steps.pages.outputs.origin }}" \
            --define=DOCS_BASE_URL="${{ steps.pages.outputs.base_path }}" \
            //docs:build

      # Bazel outputs are read-only and bazel-bin is a symlink, but the action
      # only reads and tars with --dereference, so no copy is needed.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: bazel-bin/docs/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
