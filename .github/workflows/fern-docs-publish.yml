# Publishes the Fern docs site, one version per toolkit release line.
#
# The toolkit release tag (toolkit/vX.Y.Z) defines the docs version: operators
# deploy the toolkit, and it pins the catalog it ships. Every run rebuilds each
# MAJOR.MINOR line from its highest final tag, so the site never depends on
# state left by an earlier publish; tools/fern_docs_versions.py documents the
# selection. Until a toolkit release contains the Fern docs, the site publishes
# unversioned from main.
#
# The Fern configuration and tooling always come from main, so a patch tag on an
# older release branch cannot publish with that branch's older configuration.
#
# Required configuration:
# - Organization secret: FERN_TOKEN (from `fern token` for the nvidia Fern org)

name: Publish Fern Docs

on:
  push:
    tags:
      # Final releases only; release candidates do not change the docs.
      - "toolkit/v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: fern-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    # Secrets are exposed to this job, so publish only from the upstream
    # repository, on a toolkit release tag or a manual run from main.
    if: >-
      github.repository == 'dsx-ai-factory/health-validation' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/toolkit/v'))
    runs-on: linux-amd64-cpu4
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Every toolkit tag is needed to rebuild every version.
          fetch-depth: 0
          persist-credentials: false

      - name: Stage docs versions
        run: python3 tools/fern_docs_versions.py --fern-dir fern

      - name: Check docs paths stay inside docs
        # Versions are staged from release tags, so check what Fern will read
        # with FERN_TOKEN in its environment.
        run: >-
          python3 tools/check-docs-paths
          --allow '../docs/index.yml'
          --allow '../collect/proto'
          --allow '../collect/proto/health/v1/check.proto'
          docs fern

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install Fern CLI
        # Intentionally unpinned: Fern ships often with no LTS channel and the
        # NVIDIA global theme tracks the latest CLI, so a pin goes stale and
        # breaks more than it protects. Do not pin.
        run: npm install -g fern-api@latest

      - name: Publish docs
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        working-directory: ./fern
        run: |
          set -eo pipefail
          fern generate --docs 2>&1 | tee /tmp/fern-output.log
          # Fern prints "Published docs to URL", sometimes followed by " (URL)".
          URL=$(sed -n 's/.*Published docs to \(https:[^[:space:]]*\).*/\1/p' /tmp/fern-output.log | tail -1)
          if [ -n "$URL" ]; then
            echo "### Published: [$URL]($URL)" >> "$GITHUB_STEP_SUMMARY"
          fi
