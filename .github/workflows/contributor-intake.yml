# Affiliation classification requires explicit pilot activation.
name: Contribution intake pilot

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]
  workflow_dispatch:
    inputs:
      kind:
        description: Item type
        required: true
        type: choice
        options: [issue, pr]
      number:
        description: Issue or PR number to classify with current evidence
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: contribution-intake-${{ github.repository }}-${{ github.event.inputs.number || github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  intake:
    if: >-
      github.repository == 'dsx-ai-factory/health-validation' &&
      vars.HEALTH_VALIDATION_INTAKE_ENABLED == 'true' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Contribution metadata is untrusted; only reviewed default-branch code runs.
      - name: Checkout trusted main only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
          allow-unsafe-pr-checkout: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.20.0'
          package-manager-cache: false

      - name: Create DSX membership token
        id: dsx_membership
        if: vars.HEALTH_VALIDATION_MEMBERSHIP_APP_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        env:
          NODE_USE_ENV_PROXY: "1"
        with:
          client-id: ${{ vars.HEALTH_VALIDATION_MEMBERSHIP_APP_CLIENT_ID }}
          private-key: ${{ secrets.HEALTH_VALIDATION_MEMBERSHIP_APP_PRIVATE_KEY }}
          owner: dsx-ai-factory
          permission-members: read

      - name: Create NVIDIA membership token
        id: nvidia_membership
        if: vars.HEALTH_VALIDATION_MEMBERSHIP_APP_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        env:
          NODE_USE_ENV_PROXY: "1"
        with:
          client-id: ${{ vars.HEALTH_VALIDATION_MEMBERSHIP_APP_CLIENT_ID }}
          private-key: ${{ secrets.HEALTH_VALIDATION_MEMBERSHIP_APP_PRIVATE_KEY }}
          owner: NVIDIA
          permission-members: read

      - name: Classify affiliation
        env:
          HEALTH_VALIDATION_APPLY_LABELS: 'true'
          GITHUB_TOKEN: ${{ github.token }}
          HEALTH_VALIDATION_DSX_MEMBERSHIP_TOKEN: ${{ steps.dsx_membership.outputs.token }}
          HEALTH_VALIDATION_NVIDIA_MEMBERSHIP_TOKEN: ${{ steps.nvidia_membership.outputs.token }}
          HEALTH_VALIDATION_REVIEWED_DECISIONS_JSON: ${{ secrets.HEALTH_VALIDATION_REVIEWED_DECISIONS_JSON }}
        run: node tools/contributor-intake/actions-intake.mjs intake
