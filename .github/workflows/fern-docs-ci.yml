# Validates Fern docs configuration on pull requests that touch docs or fern/.

name: Fern Docs CI

# Triggered by copy-pr-bot's pull-request/<number> branches, like ci.yml, so the
# self-hosted runner is not reachable from untrusted forks.
on:
  push:
    branches:
      - "pull-request/[0-9]+"
    paths:
      - 'docs/**'
      - 'fern/**'
      - 'tools/check-docs-mdx'
      - 'tools/check-docs-paths'
      - 'tools/fern_docs_versions.py'
      - '.github/workflows/fern-docs-ci.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fern-check:
    name: Fern Check
    if: github.repository == 'dsx-ai-factory/health-validation'
    runs-on: linux-amd64-cpu4
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check markdown filename conventions
        run: |
          BAD=$(find docs/ -name '*.md' | grep -E '[A-Z_]' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Markdown filenames must be lowercase with hyphens only:"
            echo "$BAD"
            exit 1
          fi

      - name: Check docs paths stay inside docs
        # Fern reads any file a page names, and the publish and preview jobs run
        # it with FERN_TOKEN. fern/generators.yml points at collect/proto by design.
        run: >-
          python3 tools/check-docs-paths
          --allow '../docs/index.yml'
          --allow '../collect/proto'
          --allow '../collect/proto/health/v1/check.proto'
          docs fern

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install Fern CLI
        # Intentionally unpinned: Fern ships often with no LTS channel and the
        # NVIDIA global theme tracks the latest CLI, so a pin goes stale and
        # breaks more than it protects. Do not pin.
        run: npm install -g fern-api@latest

      - name: Check MDX safety
        # developer.md is GitHub-only and not in docs/index.yml.
        run: python3 tools/check-docs-mdx --exclude 'docs/developer.md' docs fern

      - name: Fern check
        run: fern check

      - name: Check MDX validity
        run: fern docs md check

      - name: Check broken links
        run: fern docs broken-links

      - name: Check versioned configuration
        # Publishing replaces the docs.yml version list with ref-backed release
        # versions. Write that list under a local placeholder tag so a docs.yml
        # change that breaks the rewrite, or a list Fern rejects, fails here
        # rather than at release time.
        run: |
          set -eo pipefail
          git tag v999.0.0
          python3 tools/fern_docs_versions.py --fern-dir fern
          grep -q '^    ref: v999.0.0$' fern/docs.yml
          fern check
