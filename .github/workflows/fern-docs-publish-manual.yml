# Publishes the current docs from main as a single, unversioned Fern site.
#
# Manual only. This stands in for the versioned publish workflow until the
# project chooses which release tag defines the docs version: every tag in this
# repo is module-prefixed (catalog/vX.Y.Z, toolkit/vX.Y.Z), and the versioned
# workflow accepts only a plain vMAJOR.MINOR.PATCH tag. Replace this workflow
# with that one once the tag is chosen.
#
# Required configuration:
# - Organization secret: FERN_TOKEN (from `fern token` for the nvidia Fern org)

name: Publish Fern Docs (manual)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: fern-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    # Secrets are exposed to this job, so publish only from main of the
    # upstream repository.
    if: github.repository == 'dsx-ai-factory/health-validation' && github.ref == 'refs/heads/main'
    runs-on: linux-amd64-cpu4
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install Fern CLI
        # Intentionally unpinned: Fern ships often with no LTS channel and the
        # NVIDIA global theme tracks the latest CLI, so a pin goes stale and
        # breaks more than it protects. Do not pin.
        run: npm install -g fern-api@latest

      - name: Publish docs
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        working-directory: ./fern
        run: |
          set -eo pipefail
          fern generate --docs 2>&1 | tee /tmp/fern-output.log
          # Fern prints "Published docs to URL", sometimes followed by " (URL)".
          URL=$(sed -n 's/.*Published docs to \(https:[^[:space:]]*\).*/\1/p' /tmp/fern-output.log | tail -1)
          if [ -n "$URL" ]; then
            echo "### Published: [$URL]($URL)" >> "$GITHUB_STEP_SUMMARY"
          fi
