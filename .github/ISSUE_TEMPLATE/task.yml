name: Task / Question
description: General question, documentation gap, or a task that is neither a bug nor a feature.
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for usage questions, documentation gaps, concrete tasks,
        and specific technical questions.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What do you need, or what should be done?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context / background
      description: Any relevant context, links, or prior discussion.
    validations:
      required: false
