name: Set up Bazel
description: Install Bazelisk and configure Bazel caching, shared across all CI jobs.

inputs:
  disk-cache:
    description: >-
      Bazel disk cache key. Defaults to the calling workflow's name. Set it to
      another workflow's name to share that workflow's cache, which is worth
      doing when both build the same targets.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Bazelisk
      shell: bash
      run: |
        arch=${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}
        mkdir -p "$HOME/.local/bin"
        curl -fsSL -o "$HOME/.local/bin/bazel" \
          "https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-linux-${arch}"
        chmod +x "$HOME/.local/bin/bazel"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86
      with:
        bazelisk-version: 1.28.1
        bazelisk-cache: true
        disk-cache: ${{ inputs.disk-cache || github.workflow }}
        repository-cache: true
