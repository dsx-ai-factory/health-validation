name: Scan image
description: >-
  Build the amd64 health-validation image, scan it for CVEs, generate an
  SBOM, and fail if it carries a fixable Critical. Shared by the scan and
  scan-release jobs, which differ only in whether their token is allowed to
  attach the SBOM to a GitHub Release.

runs:
  using: composite
  steps:
    # Exercise both platform transitions and the OCI index assembly on every
    # workflow run, including pull-request branches that never publish.
    - name: Build the multi-architecture image index
      shell: bash
      run: bazel build --config=ci //toolkit/cmd/health-validation:health-validation.image.index

    - name: Build and load the amd64 image for scanning
      shell: bash
      run: |
        bazel build --config=ci --platforms=//build/platforms:linux_amd64 \
          //toolkit/cmd/health-validation:health-validation.image.tar
        docker load -i \
          bazel-bin/toolkit/cmd/health-validation/health-validation.image.local_load/tarball.tar
        docker image inspect health-validation:latest > /dev/null

    # Emits the SBOM, JSON/SARIF/table reports, and a step summary. SARIF goes
    # to the Security tab, which is the advisory channel here — every High is
    # visible there without failing the build. generate-sbom also attaches
    # the SBOM to the tag's GitHub Release when one exists, which needs
    # contents: write — the caller job's permissions decide whether that
    # succeeds, not this action.
    - name: Grype vulnerability scan
      id: scan
      uses: dsx-ai-factory/dsx-github-actions/.github/actions/security-container-scan@d15d46d22d09f7111177a6f5e9f7ae9933e067b2 # v1.20.0
      with:
        image: health-validation:latest
        fail-on: critical
        fail-build: 'false'
        generate-sbom: 'true'
        sbom-artifact-name: container.spdx.json
        upload-sarif: 'true'
        sarif-category: grype-health-validation

    # `ok` and `high_or_error` are the two statuses that mean Grype actually
    # ran. Anything else (image_not_found, sbom_failed, pull_failed) means the
    # scan produced no verdict, which must not pass as a clean result.
    - name: Verify the scan ran
      if: steps.scan.outputs.status != 'ok' && steps.scan.outputs.status != 'high_or_error'
      shell: bash
      run: |
        echo "::error::scan did not run: ${{ steps.scan.outputs.status }} — ${{ steps.scan.outputs.detail }}"
        exit 1

    # The action has no --only-fixed, so the fixable-only gate is applied here.
    # An unfixable Critical cannot be cleared from this repo and would wedge
    # CI; a fixable one means bump the base image or raise the Go version for
    # stdlib findings.
    - name: Block on Criticals with a fix available
      shell: bash
      run: >
        jq -e
        '[.matches[] | select(.vulnerability.severity == "Critical" and .vulnerability.fix.state == "fixed")] | length == 0'
        "${{ steps.scan.outputs.report_json }}"
