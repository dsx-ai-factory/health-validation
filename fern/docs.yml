instances:
  - url: nvidia-health-validation.docs.buildwithfern.com/health-validation
    custom-domain: docs.nvidia.com/health-validation
    multi-source: true

redirects:
  - source: /health-validation/index.html
    destination: /health-validation

title: NVIDIA Health Validation

global-theme: nvidia

logo:
  href: /health-validation
  right-text: Health Validation

navbar-links:
  - type: github
    value: https://github.com/dsx-ai-factory/health-validation

# One working-tree version. Every release tag carries this file, and a ref-backed
# version builds its tag's default version, so it serves that tag's own docs.
# The publish job replaces this list with one ref entry per release line
# (tools/fern_docs_versions.py).
versions:
  - display-name: Latest
    path: ../docs/index.yml
    slug: latest
